name: 文档问题
description: 文档写错、写漏、写不清，或与代码行为不一致
title: "[文档] "
labels: ["documentation"]
body:
  - type: input
    id: where
    attributes:
      label: 位置
      placeholder: 文件路径与小节（例如 README.md「配置」）
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 问题
      description: 现在写的是什么？哪里不对（或与实测行为不符）？
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议（可选）
      description: 你希望看到怎么表述？有实测证据更好
